# VisDrone Person-Only Config
# Fine-tune YOLO for drone-perspective person detection
# Original VisDrone has 10 classes - we only keep pedestrian (0) and people (1)

path: ./datasets/VisDrone  # auto-downloaded by ultralytics
train: VisDrone2019-DET-train/images
val: VisDrone2019-DET-val/images
test: VisDrone2019-DET-test-dev/images

# Full VisDrone classes (needed for loading - filtering done in training script)
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
